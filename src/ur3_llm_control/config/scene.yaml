world_frame: base_link
planning_group: ur_manipulator
eef_link: tool0
move_action: /move_action
execute_action: /execute_trajectory
apply_scene_service: /apply_planning_scene
planning_pipeline: ""
planner_id: ""
planning_time_sec: 5.0
planning_attempts: 8
velocity_scaling: 0.05
acceleration_scaling: 0.05
orientation_tolerance_rad: 0.12
approach_height_m: 0.06
place_clearance_m: 0.002
tool_orientation_xyzw: [1.0, 0.0, 0.0, 0.0]
home_joint_tolerance_rad: 0.04
home_joint_positions:
  shoulder_pan_joint: 0.0
  shoulder_lift_joint: 0.0
  elbow_joint: 0.0
  wrist_1_joint: 0.0
  wrist_2_joint: 0.0
  wrist_3_joint: 0.0

table:
  # The configured top surface is z=0.32 m; keep the table footprint clear of the robot base.
  center_xyz: [0.53, 0.0, 0.30]
  size_xyz: [0.34, 0.65, 0.04]

objects:
  red_cube:
    label_vi: "khối lập phương đỏ"
    position_xyz: [0.38, -0.08, 0.34]
    size_xyz: [0.04, 0.04, 0.04]
  yellow_cube:
    label_vi: "khối lập phương vàng"
    position_xyz: [0.38, 0.0, 0.34]
    size_xyz: [0.04, 0.04, 0.04]
  blue_cube:
    label_vi: "khối lập phương xanh lam"
    position_xyz: [0.38, 0.08, 0.34]
    size_xyz: [0.04, 0.04, 0.04]

# surface_xyz is the table surface point at the center of each placement zone.
zones:
  zone_a:
    label_vi: "vùng A"
    surface_xyz: [0.43, -0.12, 0.32]
  zone_b:
    label_vi: "vùng B"
    surface_xyz: [0.43, 0.0, 0.32]
  zone_c:
    label_vi: "vùng C"
    surface_xyz: [0.43, 0.12, 0.32]

# A real FollowJointTrajectory gripper action server is required for pick/place.
# Set enabled=true and adapt action, joints, positions and touch_links to the installed gripper.
gripper:
  enabled: false
  action: /gripper_controller/follow_joint_trajectory
  joint_names: []
  open_positions: []
  closed_positions: []
  motion_time_sec: 1
  touch_links: [tool0, flange, wrist_3_link]
